services:
  front:
    build: ./front
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      BACK_ORIGIN: "http://back:8000"
    ports:
      - "${FRONT_PORT:-3000}:3000"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - front_next:/app/.next

  back:
    build: ./back
    working_dir: /app
    command: sh -c "composer install --no-interaction && php -S 0.0.0.0:8000 -t public public/index.php"
    environment:
      DATABASE_URL: "mysql://oeuvres:oeuvres_local@database:3306/oeuvres?serverVersion=8.4.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mail:1025"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACK_PORT:-18080}:8000"
    volumes:
      - ./back:/app
      - back_vendor:/app/vendor
      - back_var:/app/var

  database:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: oeuvres
      MYSQL_USER: oeuvres
      MYSQL_PASSWORD: oeuvres_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"

volumes:
  mysql_data:
  front_node_modules:
  front_next:
  back_vendor:
  back_var:
